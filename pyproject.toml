[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aim-pgx"
version = "0.1.0"
description = "Match fictional patient genetic results to CPIC prescribing guidance"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.11,<3"]

[project.scripts]
aim-pgx = "aim_pgx.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/aim_pgx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["agent.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
